<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where's My Bus? - Live Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .pulse-ring {
      animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-xl">
    <div class="container mx-auto px-4 py-6">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-lg">
            <span class="text-3xl">🚌</span>
          </div>
          <div>
            <h1 class="text-2xl font-bold">Where's My Bus?</h1>
            <p class="text-blue-100 text-sm">Live tracking made simple</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <div id="connectionDot" class="w-3 h-3 bg-gray-400 rounded-full"></div>
          <span class="text-sm font-medium" id="status">Connecting...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-xl shadow-lg p-4">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="🔍 Search by bus name or number..." 
          class="w-full px-4 py-3 text-lg border-0 focus:outline-none focus:ring-0"
        />
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container mx-auto px-4 pb-8">
    <div id="busesContainer">
      <div class="text-center py-12">
        <div class="inline-block relative">
          <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-200 border-t-blue-600"></div>
        </div>
        <p class="mt-6 text-gray-600 text-lg font-medium">Loading buses...</p>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtKELj-IGZLrTROA1hFKfIkKYOvzwO5c4",
      authDomain: "bus-tracker-ddff7.firebaseapp.com",
      databaseURL: "https://bus-tracker-ddff7-default-rtdb.firebaseio.com",
      projectId: "bus-tracker-ddff7",
      storageBucket: "bus-tracker-ddff7.appspot.com",
      messagingSenderId: "133173957301",
      appId: "1:133173957301:web:1e8ac7102fe723885f24fc",
      measurementId: "G-ZLQ1YKRFCM"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allBusesData = {};
    let allLocationsData = {};

    function updateConnectionStatus(connected) {
      const dot = document.getElementById('connectionDot');
      const status = document.getElementById('status');
      
      if (connected) {
        dot.className = 'w-3 h-3 bg-green-500 rounded-full pulse-ring';
        status.textContent = 'Live';
      } else {
        dot.className = 'w-3 h-3 bg-red-500 rounded-full';
        status.textContent = 'Offline';
      }
    }

    function getTimeSince(timestamp) {
      if (!timestamp) return 'No data';
      
      const now = new Date();
      const then = new Date(timestamp);
      const seconds = Math.floor((now - then) / 1000);
      
      if (seconds < 60) return 'Just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function isRecentlyActive(timestamp) {
      if (!timestamp) return false;
      const now = new Date();
      const then = new Date(timestamp);
      return (now - then) < 300000; // 5 minutes
    }

    function loadBuses() {
      const busesRef = database.ref('buses');
      const locationsRef = database.ref('bus_locations');

      busesRef.on('value', (snapshot) => {
        allBusesData = snapshot.val() || {};
        updateConnectionStatus(true);
        renderBuses();
      }, (error) => {
        updateConnectionStatus(false);
        showMessage('Connection error: ' + error.message, 'error');
      });

      locationsRef.on('value', (snapshot) => {
        allLocationsData = snapshot.val() || {};
        renderBuses();
      });
    }

    function renderBuses(searchTerm = '') {
      const container = document.getElementById('busesContainer');
      const busIds = Object.keys(allBusesData);

      if (busIds.length === 0) {
        showMessage('No buses available', 'info');
        return;
      }

      let filteredBuses = busIds.filter(busId => {
        const bus = allBusesData[busId];
        const searchLower = searchTerm.toLowerCase();
        return bus.name.toLowerCase().includes(searchLower) || 
               bus.number.toLowerCase().includes(searchLower);
      });

      if (filteredBuses.length === 0) {
        showMessage('No buses match your search', 'info');
        return;
      }

      let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';

      filteredBuses.forEach(busId => {
        const bus = allBusesData[busId];
        const location = allLocationsData[busId];
        const isActive = location && isRecentlyActive(location.timestamp);
        const timeSince = getTimeSince(location?.timestamp);

        html += `
          <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1">
            <div class="bg-gradient-to-r ${isActive ? 'from-green-500 to-emerald-500' : 'from-gray-400 to-gray-500'} p-4">
              <div class="flex justify-between items-start">
                <div class="text-white">
                  <h3 class="text-xl font-bold mb-1">${bus.name}</h3>
                  <p class="text-sm opacity-90">Bus #${bus.number}</p>
                </div>
                <div class="flex items-center space-x-2">
                  ${isActive ? '<div class="w-3 h-3 bg-white rounded-full pulse-ring"></div>' : ''}
                  <span class="bg-white bg-opacity-30 backdrop-blur-sm px-3 py-1 rounded-full text-white text-xs font-semibold">
                    ${isActive ? '🟢 Live' : '⚪ Offline'}
                  </span>
                </div>
              </div>
            </div>

            <div class="p-6">
              ${location ? `
                <div class="space-y-3 mb-4">
                  <div class="flex items-center justify-between p-3 bg-blue-50 rounded-lg">
                    <span class="text-gray-600 text-sm font-medium">📍 Last Update</span>
                    <span class="text-blue-700 font-semibold text-sm">${timeSince}</span>
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-gray-50 rounded-lg">
                      <p class="text-xs text-gray-500 mb-1">Latitude</p>
                      <p class="font-mono text-sm font-semibold text-gray-800">${location.latitude.toFixed(6)}</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                      <p class="text-xs text-gray-500 mb-1">Longitude</p>
                      <p class="font-mono text-sm font-semibold text-gray-800">${location.longitude.toFixed(6)}</p>
                    </div>
                  </div>
                </div>
              ` : `
                <div class="text-center py-8">
                  <div class="text-4xl mb-2">📍</div>
                  <p class="text-gray-500 text-sm">Location not available</p>
                </div>
              `}

              <button 
                onclick="viewOnMap(${location?.latitude}, ${location?.longitude})"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-3 px-4 rounded-xl font-semibold transition-all duration-300 shadow-md hover:shadow-lg transform active:scale-95 ${!location ? 'opacity-50 cursor-not-allowed' : ''}"
                ${!location ? 'disabled' : ''}
              >
                🗺️ View on Google Maps
              </button>
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function viewOnMap(lat, lng) {
      if (lat && lng) {
        window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
      } else {
        alert('❌ Location not available for this bus');
      }
    }

    function showMessage(message, type) {
      const icons = {
        error: '❌',
        info: 'ℹ️',
        success: '✅'
      };

      const colors = {
        error: 'from-red-500 to-pink-500',
        info: 'from-blue-500 to-indigo-500',
        success: 'from-green-500 to-emerald-500'
      };

      document.getElementById('busesContainer').innerHTML = `
        <div class="max-w-md mx-auto">
          <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-r ${colors[type]} rounded-full flex items-center justify-center">
              <span class="text-4xl">${icons[type]}</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">${message}</h3>
          </div>
        </div>
      `;
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderBuses(e.target.value);
    });

    // Start the app
    loadBuses();
  </script>
</body>
</html>
